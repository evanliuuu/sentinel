[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Local checks over a package-registry snapshot."
requires-python = ">=3.11"
dependencies = [
    "packaging>=24",
    "pyarrow>=15",
    "pyspark>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
