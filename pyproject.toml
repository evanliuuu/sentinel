[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Local checks over a package-registry snapshot."
requires-python = ">=3.11"
dependencies = [
    "packaging>=24",
    "pyarrow>=15",
    "pyyaml>=6",
    "pyspark>=3.5",
]

[project.optional-dependencies]
dev = [
    "apache-airflow==2.10.5",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "protobuf>=6.31",
    "pytest>=8",
    "typing-extensions>=4.14",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
